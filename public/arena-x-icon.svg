<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a4b"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)" stroke="#1f2430" stroke-width="2"/>
  <!-- Stylized Hexagon outline -->
  <polygon points="50,8 88,28 88,72 50,92 12,72 12,28" fill="none" stroke="#252c3d" stroke-width="2"/>
  <!-- X Slash Left (Red) -->
  <path d="M26,22 L44,48 L36,78 L22,78 L34,50 L20,22 Z" fill="url(#redGlow)" filter="url(#glow)"/>
  <!-- X Slash Right (Blue) -->
  <path d="M74,22 L56,48 L64,78 L78,78 L66,50 L80,22 Z" fill="url(#blueGlow)" filter="url(#glow)"/>
  <!-- Central Diamond Core -->
  <polygon points="50,40 58,50 50,60 42,50" fill="#ffffff" filter="url(#glow)"/>
</svg>
